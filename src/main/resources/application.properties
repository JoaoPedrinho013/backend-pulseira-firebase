spring.application.name=backend-pulseira-firebase

# Use a mesma porta ao alternar os backends.
server.port=${SERVER_PORT:8080}

# Firebase configuration. Service account credentials are supplied through
# GOOGLE_APPLICATION_CREDENTIALS (never commit the JSON key).
firebase.project-id=${FIREBASE_PROJECT_ID:zelo-pulseira-kotlin}
firebase.web-api-key=${FIREBASE_WEB_API_KEY:}

zelo.cors.origins=${ZELO_CORS_ORIGINS:http://localhost:5173}
zelo.admin.email=${ZELO_ADMIN_EMAIL:}
zelo.admin.senha=${ZELO_ADMIN_SENHA:}
zelo.descoberta.porta=${ZELO_DISCOVERY_PORT:41234}
